# Hyprlock — One Dark Pro Darker
background {
    monitor =
    path = __DOTFILES_HOME__/Escritorio/Wallpapers/one-dark-arch-aurora.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.48
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

# Acento superior
shape {
    monitor =
    size = 360, 4
    color = rgba(97, 175, 239, 0.95)
    rounding = 2
    position = 0, 145
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(215, 218, 224, 1.0)
    font_size = 58
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(152, 195, 121, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(198, 120, 221, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 330, 52
    outline_thickness = 2
    outer_color = rgba(97, 175, 239, 0.95)
    inner_color = rgba(30, 34, 39, 0.92)
    font_color = rgba(171, 178, 191, 1.0)
    check_color = rgba(229, 192, 123, 1.0)
    fail_color = rgba(224, 108, 117, 1.0)
    capslock_color = rgba(209, 154, 102, 1.0)
    numlock_color = rgba(86, 182, 194, 1.0)
    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.28
    fade_on_empty = false
    placeholder_text = <span foreground="##5c6370">󰌾  Contraseña…</span>
    fail_text = <span foreground="##e06c75">$PAMFAIL$FPRINTFAIL  ($ATTEMPTS)</span>
    position = 0, -92
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  Sesión bloqueada
    color = rgba(92, 99, 112, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -142
    halign = center
    valign = center
}
