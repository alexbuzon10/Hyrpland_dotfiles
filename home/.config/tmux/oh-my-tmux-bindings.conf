# Atajos inspirados en Oh my tmux!
# Archivo independiente: no se carga automáticamente desde ~/.tmux.conf.
# Fuente: https://github.com/gpakosz/.tmux#bindings

# Sesiones
bind C-c new-session
bind C-f command-prompt -p "Sesión:" "switch-client -t '%%'"
bind BTab switch-client -l

# Ventanas
bind C-h previous-window
bind C-l next-window
bind Tab last-window
bind C-S-H swap-window -t -1 \; select-window -t -1
bind C-S-L swap-window -t +1 \; select-window -t +1

# Paneles
# '-' ya coincide con la división vertical de la configuración principal.
# Restaurar también el atajo clásico de tmux: Prefix + " divide arriba/abajo.
bind '"' split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
# h/j/k/l y H/J/K/L ya coinciden con navegación y redimensionado.
bind '<' swap-pane -U
bind '>' swap-pane -D
# Oh my tmux! maximiza en una ventana temporal; sin el framework usamos zoom nativo.
bind + resize-pane -Z

# Copy mode y buffers
bind Enter copy-mode
bind b list-buffers
bind p paste-buffer
bind P choose-buffer -Z
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# Limpiar pantalla e historial de tmux sin prefijo.
bind -n C-l send-keys C-l \; clear-history

# U (Urlscan/Urlview) y F (PathPicker) no se añaden: no están instalados.
