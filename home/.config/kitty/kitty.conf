# Kitty — One Dark Pro Darker (VS Code / Atom)

# Fuente
font_family      JetBrainsMono Nerd Font
font_size        10.5
disable_ligatures always

# Ventana
window_padding_width 25
background_opacity   0.7
dynamic_background_opacity yes
window_border_width  1px
active_border_color  #61afef
inactive_border_color #3e4452

# Colores base
background            #23272e
foreground            #abb2bf
selection_background  #343a45
selection_foreground  #d7dae0
cursor                 #d7dae0
cursor_text_color      #23272e
url_color              #56b6c2

# Paleta ANSI oficial One Dark Pro Darker
color0  #3f4451
color1  #e05561
color2  #8cc265
color3  #d18f52
color4  #4aa5f0
color5  #c162de
color6  #42b3c2
color7  #d7dae0
color8  #4f5666
color9  #ff616e
color10 #a5e075
color11 #f0a45d
color12 #4dc4ff
color13 #de73ff
color14 #4cd1e0
color15 #e6e6e6

# Pestañas
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #1e2227
active_tab_background #61afef
active_tab_foreground #23272e
inactive_tab_background #2c313a
inactive_tab_foreground #7f848e

# Sin campana visual
enable_audio_bell no

# Scrollback y URLs
scrollback_lines 10000
url_style curly
detect_urls yes

# Cursor
cursor_shape beam
cursor_beam_thickness 1.8

# Portapapeles (estilo s4vitar)
map ctrl+c copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b
map f5 copy_to_buffer c
map f6 paste_from_buffer c
map f7 copy_to_buffer d
map f8 paste_from_buffer b

# Ventanas/splits
map ctrl+shift+enter launch --cwd=current
map ctrl+left neighboring_window left
map ctrl+down neighboring_window bottom
map ctrl+up neighboring_window top
map ctrl+right neighboring_window right
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack

# Pestañas (los "espacios de trabajo" de Kitty)
map ctrl+shift+t new_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward
map ctrl+shift+alt+t set_tab_title

# Tamaño de fuente
map ctrl+shift+up change_font_size all +1.0
map ctrl+shift+down change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Activa el rastro animado del cursor
cursor_trail 1

# Duración del rastro en milisegundos (puedes ajustar el valor)
cursor_trail_decay 0.1 0.25

# Distancia mínima que debe recorrer el cursor para activar la animación
##cursor_trail_start_threshold 2

# Tiempo en segundos que tarda el cursor en moverse suavemente a una nueva posición
cursor_animation_decay 0.1 0.1

custom_shaders cursor-trail-motion-blur
