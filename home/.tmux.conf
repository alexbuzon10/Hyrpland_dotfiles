# ============================================================
# ~/.tmux.conf
# Arch + Kitty + Hyprland
# ============================================================

# Terminal / color / Kitty graphics
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
# Evita caracteres fantasma al borrar en los prompts de tmux bajo Kitty.
# Fuerza a tmux a limpiar las celdas sin usar ECH (erase characters).
set -as terminal-overrides ",xterm-kitty:ech@"
set -g allow-passthrough on
set -g focus-events on

# Comportamiento
set -g mouse on
# Prefix + m conserva la acción estándar de tmux (marcar panel).
# La acción personalizada para alternar el ratón pasa a Prefix + M.
bind m select-pane -m
bind M set-option -g mouse \; display-message "Mouse: #{?mouse,activado,desactivado}"
set -g history-limit 100000
set -g escape-time 0
set -g repeat-time 300
set -g display-time 2000
set -g status-interval 5
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl+A
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Prefix + r conserva la acción estándar de tmux (redibujar cliente).
# La recarga personalizada pasa a Prefix + R.
bind r refresh-client
bind R source-file ~/.tmux.conf \; display-message "tmux.conf recargado"

# Renombrar partiendo del nombre actual
bind , command-prompt -I "#W" -p "Nombre de ventana:" "rename-window '%%'"

# Mantener el directorio actual
bind c new-window -c "#{pane_current_path}"

# Splits
# Atajos estándar de tmux, adaptados para conservar el directorio actual.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Alias cómodos adicionales; no sustituyen a los estándar.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Flechas
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Redimensionar
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

# Zoom
bind z resize-pane -Z

# Cambiar de ventana sin prefix
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n S-Left  previous-window
bind -n S-Right next-window

# Copy mode / Wayland
# Modo estándar de tmux/Emacs:
# Prefix + [ entra, C-Space selecciona, M-w copia y Prefix + ] pega.
setw -g mode-keys emacs
# Los prompts (por ejemplo, renombrar una ventana) se editan como texto normal.
# Sin esto, EDITOR=nvim hace que tmux active implícitamente los controles vi.
set -g status-keys emacs
bind [ copy-mode
bind ] paste-buffer
# Las teclas son estándar; al copiar también se sincroniza con Wayland.
bind -T copy-mode C-Space send -X begin-selection
bind -T copy-mode M-w send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#a0a3aa"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#1793D1,bold]   #S #[fg=#62666F]│ "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#737780] #I:#W "
setw -g window-status-current-format "#[fg=#111318,bg=#1793D1,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#F05032,bold"
setw -g window-status-bell-style "fg=#D75F5F,bold"

set -g status-right "#[fg=#111318,bg=#F05032,bold]#{?client_prefix, PREFIX ,}#[default]#{?client_prefix, ,}#[fg=#d5d5d5]#(whoami) #[fg=#62666F]│ #[fg=#F05032]#(~/.config/tmux/scripts/git-branch.sh #{q:pane_current_path})#[fg=#d5d5d5]#(~/.config/tmux/scripts/battery.sh) #[fg=#62666F]│ #[fg=#87C9E8]%H:%M "

# Pane borders
set -g pane-border-style "fg=#343840"
set -g pane-active-border-style "fg=#1793D1"
set -g pane-border-status off

# Mensajes y comandos
# Ambos sustituyen visualmente toda la barra con un fondo propio:
# amarillo cálido para avisos de tmux y naranja Git para comandos/prompts.
set -g message-style "bg=#E5C07B,fg=#111318,bold,width=100%,align=left,fill=#E5C07B"
set -g message-command-style "bg=#F05032,fg=#111318,bold,width=100%,align=left,fill=#F05032"
set -g mode-style "bg=#1793D1,fg=#111318,bold"

# Títulos
set -g set-titles on
set -g set-titles-string "tmux · #S · #W"

# Sesiones
set -g detach-on-destroy off
